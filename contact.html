<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt – Konrad Amrhein</title>
    <meta name="description" content="Kontaktinformationen für Konrad Amrhein." />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="menu-icon" type="button" onclick="toggleMenu()" aria-controls="sideMenu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <nav class="overlay-menu" id="sideMenu" aria-label="Hauptnavigation">
        <button class="menu-close" type="button" onclick="toggleMenu()" aria-label="Menü schließen">✕</button>
        <div class="menu-items">
            <a href="index.html" onclick="toggleMenu()">Start</a>
            <a href="about.html" onclick="toggleMenu()">Über mich</a>
            <a href="projects.html" onclick="toggleMenu()">Projekte</a>
            <a href="contact.html" onclick="toggleMenu()">Kontakt</a>
        </div>
    </nav>

    <main id="main">
        <h1>Kontakt</h1>
        <p>Schreib mir eine Nachricht.</p>
        <p>Email: <a href="mailto:kontakt@konradamrhein.de">kontakt@konradamrhein.de</a></p>
        <form action="https://kontaktformularworker.kontakt-473.workers.dev" method="POST" aria-label="Kontaktformular">
            <label for="name">Name</label>
            <input id="name" name="name" type="text">
            <label for="email">Email</label>
            <input id="email" name="email" type="email">
            <label for="message">Nachricht</label>
            <textarea id="message" name="message" rows="6"></textarea>
            <button type="submit">Absenden</button>
        </form>
    </main>

    <script>
        const menuBtn = document.querySelector('.menu-icon');
        const sideMenu = document.getElementById('sideMenu');
        function toggleMenu() {
            const open = sideMenu.classList.toggle('open');
            document.body.classList.toggle('menu-open', open);
            menuBtn.classList.toggle('is-open', open);
            menuBtn.setAttribute('aria-expanded', open);
            if (open) sideMenu.querySelector('a').focus(); else menuBtn.focus();
        }
        menuBtn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMenu(); } });
    </script>
</body>
</html>
