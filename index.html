<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konrad Amrhein – Regisseur | Moderator | Sprecher</title>
    <meta name="description" content="Konrad Amrhein – Regisseur, Moderator und Sprecher. Portfolio, Projekte und Kontakt." />
    <link rel="stylesheet" href="style.css">
</head>
<body class="home">
    <div class="slideshow-wrapper" aria-hidden="true">
        <div class="slideshow-slide slide-a"></div>
        <div class="slideshow-slide slide-b"></div>
    </div>

    <!-- Hamburger Icon oben links -->
    <button class="menu-icon" type="button" onclick="toggleMenu()" aria-controls="sideMenu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Das ausklappbare Menü -->
    <nav class="overlay-menu" id="sideMenu" aria-label="Hauptnavigation">
        <button class="menu-close" type="button" onclick="toggleMenu()" aria-label="Menü schließen">✕</button>
        <div class="menu-items">
            <a href="index.html" onclick="toggleMenu()">Start</a>
            <a href="about.html" onclick="toggleMenu()">Über mich</a>
            <a href="projects.html" onclick="toggleMenu()">Projekte</a>
            <a href="contact.html" onclick="toggleMenu()">Kontakt</a>
        </div>
    </nav>

    <!-- Hero / Visitenkarte (füllt Viewport) -->
    <section id="hero" class="section hero">
        <main id="main" class="card">
            <h1>Konrad Amrhein</h1>
        </main>
    </section>

    <!-- Aktuelles: Blog-Bereich mit horizontal scrollbaren Karten -->
    <section id="aktuelles" class="section aktuelles">
        <div class="container">
            <h2>Aktuelles</h2>
            <div class="cards-container">
                <button class="cards-arrow left" aria-label="Vorheriges">‹</button>
                <div class="cards-viewport">
                    <div class="cards-track" id="cardsTrack"></div>
                </div>
                <button class="cards-arrow right" aria-label="Nächstes">›</button>
            </div>
        </div>
    </section>

    <script>
        // ============ Menu Toggle ============
        const menuBtn = document.querySelector('.menu-icon');
        const sideMenu = document.getElementById('sideMenu');
        
        function toggleMenu() {
            const isOpen = sideMenu.classList.toggle('open');
            document.body.classList.toggle('menu-open', isOpen);
            menuBtn.classList.toggle('is-open', isOpen);
            menuBtn.setAttribute('aria-expanded', isOpen);
            const firstLink = sideMenu.querySelector('a');
            if (firstLink) (isOpen ? firstLink : menuBtn).focus();
        }

        menuBtn.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleMenu();
            }
        });

        // ============ Slideshow Setup ============
        const SLIDESHOW_CONFIG = {
            visibleDuration: 5000,
            fadeDuration: 1000,
            brightnessThreshold: 170,
            fallbackImages: [
                'images/slideshow/slide-1.jpg',
                'images/slideshow/slide-2.jpg',
                'images/slideshow/slide-3.jpg',
                'images/slideshow/slide-4.jpg',
                'images/slideshow/slide-5.jpg'
            ]
        };

        let homeImages = [];
        let brightnessValues = [];
        let currentSlide = 0;
        let activeSlide = document.querySelector('.slide-a');
        let inactiveSlide = document.querySelector('.slide-b');
        const bodyEl = document.body;

        function calculateBrightness(image) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const regionSize = 0.35;
            const regionWidth = Math.max(1, Math.floor(image.naturalWidth * regionSize));
            const regionHeight = Math.max(1, Math.floor(image.naturalHeight * regionSize));
            const sourceX = Math.max(0, image.naturalWidth - regionWidth);
            const sourceY = 0;
            const destWidth = Math.min(300, regionWidth);
            const destHeight = Math.min(300, regionHeight);

            canvas.width = destWidth;
            canvas.height = destHeight;
            ctx.drawImage(image, sourceX, sourceY, regionWidth, regionHeight, 0, 0, destWidth, destHeight);

            const data = ctx.getImageData(0, 0, destWidth, destHeight).data;
            let total = 0, count = 0, step = 40;
            for (let i = 0; i < data.length; i += step) {
                const r = data[i], g = data[i + 1], b = data[i + 2];
                total += 0.299 * r + 0.587 * g + 0.114 * b;
                count++;
            }
            return count > 0 ? total / count : 0;
        }

        function preloadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve({ src, brightness: calculateBrightness(img) });
                img.onerror = () => resolve({ src, brightness: 0 });
                img.src = src;
            });
        }

        function setSlideBackground(slide, index) {
            slide.style.backgroundImage = `url('${homeImages[index]}')`;
        }

        function setHeadingColor(index) {
            const heading = document.querySelector('body.home h1');
            const isBright = brightnessValues[index] > SLIDESHOW_CONFIG.brightnessThreshold;
            heading?.classList.toggle('dark', isBright);
            bodyEl.style.setProperty('--ui-color', isBright ? '#000000' : '#ffffff');
        }

        function nextSlide() {
            const nextIndex = (currentSlide + 1) % homeImages.length;
            setSlideBackground(inactiveSlide, nextIndex);
            requestAnimationFrame(() => inactiveSlide.classList.add('active'));

            setTimeout(() => setHeadingColor(nextIndex), Math.floor(SLIDESHOW_CONFIG.fadeDuration / 2));

            setTimeout(() => {
                activeSlide.classList.remove('active');
                [activeSlide, inactiveSlide] = [inactiveSlide, activeSlide];
                currentSlide = nextIndex;
                setTimeout(nextSlide, SLIDESHOW_CONFIG.visibleDuration);
            }, SLIDESHOW_CONFIG.fadeDuration);
        }

        function initSlideshow(images) {
            homeImages = images;
            if (!homeImages.length) return;
            setSlideBackground(activeSlide, 0);
            setSlideBackground(inactiveSlide, 1);
            activeSlide.classList.add('active');
            setHeadingColor(0);
            setTimeout(nextSlide, SLIDESHOW_CONFIG.visibleDuration);
        }

        if (bodyEl.classList.contains('home')) {
            fetch('images/slideshow/manifest.json')
                .then(r => r.json())
                .then(m => {
                    const images = m.images || [];
                    return images.length ? Promise.all(images.map(preloadImage)) : Promise.reject();
                })
                .then(measures => {
                    measures.forEach((m, i) => {
                        homeImages[i] = m.src;
                        brightnessValues[i] = m.brightness;
                    });
                    initSlideshow(homeImages);
                })
                .catch(() => {
                    Promise.all(SLIDESHOW_CONFIG.fallbackImages.map(preloadImage))
                        .then(measures => {
                            homeImages = SLIDESHOW_CONFIG.fallbackImages;
                            measures.forEach((m, i) => brightnessValues[i] = m.brightness);
                            initSlideshow(homeImages);
                        });
                });
        }
    </script>

    <script>
        // ============ Cards Data & Template ============
        function createCardElement(data) {
            const article = document.createElement('article');
            article.className = 'card-vertical';
            article.tabIndex = 0;
            if (data.imagePosition) {
                article.setAttribute('data-image-position', data.imagePosition);
            }
            article.innerHTML = `
                <button class="card-close" aria-label="Schließen">✕</button>
                <img src="${data.image}" alt="${data.imageAlt}">
                <div class="card-body">
                    <h3>${data.title}</h3>
                    <p>${data.description}</p>
                    <div class="card-actions"><button class="card-more">Mehr</button></div>
                </div>
            `;
            return article;
        }

        function renderCards(track, cardsData) {
            track.innerHTML = '';
            cardsData.forEach(data => track.appendChild(createCardElement(data)));
        }

        // ============ Cards Functionality ============
        document.addEventListener('DOMContentLoaded', () => {
            const cardsTrack = document.getElementById('cardsTrack');
            
            // Load cards data from JSON
            fetch('data/cards.json')
                .then(r => r.json())
                .then(cardsData => {
                    if (cardsTrack) renderCards(cardsTrack, cardsData);
                    initializeCardHandlers();
                })
                .catch(err => console.error('Fehler beim Laden der Karten:', err));

            function initializeCardHandlers() {

            const container = document.querySelector('.cards-container');
            const viewport = container.querySelector('.cards-viewport');
            const track = container.querySelector('.cards-track');
            const [leftBtn, rightBtn] = ['.cards-arrow.left', '.cards-arrow.right'].map(sel => container.querySelector(sel));
            const cards = () => track.querySelectorAll('.card-vertical');

            function getCenterCard() {
                return track.querySelector('.card-vertical.center') || track.querySelector('.card-vertical');
            }

            function scrollToCard(card) {
                if (card) card.scrollIntoView({ behavior: 'smooth', inline: 'center' });
            }

            function handleArrowClick(direction) {
                const center = getCenterCard();
                const target = direction === 'left'
                    ? center.previousElementSibling || track.querySelector('.card-vertical')
                    : center.nextElementSibling || track.querySelector('.card-vertical:last-child');
                scrollToCard(target);
            }

            function handleArrowKey(direction, e) {
                if ((direction === 'left' && e.key === 'ArrowLeft') || 
                    (direction === 'right' && e.key === 'ArrowRight')) {
                    e.preventDefault();
                    handleArrowClick(direction);
                }
            }

            leftBtn?.addEventListener('click', () => handleArrowClick('left'));
            rightBtn?.addEventListener('click', () => handleArrowClick('right'));
            viewport.addEventListener('keydown', (e) => {
                handleArrowKey('left', e);
                handleArrowKey('right', e);
            });

            // ============ Intersection Observers ============
            const aktuellesEl = document.getElementById('aktuelles');
            if (aktuellesEl) {
                new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        aktuellesEl.classList.add('visible');
                        event.target.observe = false; // unobserve after first
                    }
                }, { threshold: 0.1 }).observe(aktuellesEl);

                new IntersectionObserver((entries) => {
                    document.body.classList.toggle('scrolled', entries[0].isIntersecting);
                }, { threshold: 0.05 }).observe(aktuellesEl);
            }

            // ============ Center Card Tracking ============
            let centerScheduled = false;

            function updateCenterClasses() {
                centerScheduled = false;
                const vRect = viewport.getBoundingClientRect();
                const centerX = vRect.left + vRect.width / 2;
                let minDist = Infinity, centerIdx = -1;

                cards().forEach((c, i) => {
                    const r = c.getBoundingClientRect();
                    const cX = r.left + r.width / 2;
                    const dist = Math.abs(cX - centerX);
                    if (dist < minDist) { minDist = dist; centerIdx = i; }
                });

                cards().forEach((c, i) => {
                    c.classList.remove('center', 'side', 'far');
                    if (i === centerIdx) c.classList.add('center');
                    else if (Math.abs(i - centerIdx) === 1) c.classList.add('side');
                    else c.classList.add('far');
                });
            }

            function scheduleUpdate() {
                if (!centerScheduled) { centerScheduled = true; requestAnimationFrame(updateCenterClasses); }
            }

            viewport.addEventListener('scroll', scheduleUpdate);
            window.addEventListener('resize', scheduleUpdate);
            scheduleUpdate();

            // ============ Track Padding & Card Expansion ============
            function updateTrackPadding() {
                const first = track.querySelector('.card-vertical');
                if (!first) return;
                const cardW = first.offsetWidth;
                const side = Math.round((viewport.clientWidth - cardW) / 2);
                track.style.paddingLeft = track.style.paddingRight = side + 'px';
            }

            window.addEventListener('resize', updateTrackPadding);
            updateTrackPadding();

            function collapseAll() {
                track.classList.remove('expanded');
                container.classList.remove('expanded');
                cards().forEach(c => c.classList.remove('expanded'));
                document.body.classList.remove('card-open');
            }

            function createOverlay(card) {
                const overlay = document.createElement('div');
                overlay.className = 'card-overlay';
                overlay.setAttribute('role', 'dialog');
                overlay.setAttribute('aria-modal', 'true');

                const innerDiv = document.createElement('div');
                innerDiv.className = 'overlay-content';

                const img = card.querySelector('img');
                const imgClone = img?.cloneNode(true) || document.createElement('img');
                if (!imgClone.src && img?.src) imgClone.src = img.src;

                const body = card.querySelector('.card-body');
                const bodyClone = document.createElement('div');
                bodyClone.className = 'card-body';
                if (body) bodyClone.innerHTML = body.innerHTML;
                bodyClone.querySelector('.card-more')?.remove();

                const closeBtn = document.createElement('button');
                closeBtn.className = 'card-close';
                closeBtn.setAttribute('aria-label', 'Schließen');
                closeBtn.innerText = '✕';

                innerDiv.appendChild(imgClone);
                innerDiv.appendChild(bodyClone);
                overlay.appendChild(innerDiv);
                overlay.appendChild(closeBtn);

                return { overlay, closeBtn };
            }

            function toggleCardExpand(card) {
                if (card.classList.contains('expanded')) {
                    collapseAll();
                    return;
                }

                const scrollY = window.scrollY;
                const { overlay, closeBtn } = createOverlay(card);

                track.classList.add('expanded');
                container.classList.add('expanded');
                document.body.appendChild(overlay);
                card.classList.add('overlay-open');

                document.body.style.position = 'fixed';
                document.body.style.width = '100%';
                document.body.style.top = `-${scrollY}px`;
                document.body.classList.add('card-open');

                overlay.setAttribute('tabindex', '-1');
                overlay.focus();

                function removeOverlay() {
                    overlay.remove();
                    card.classList.remove('overlay-open');
                    document.body.style.position = '';
                    document.body.style.width = '';
                    document.body.style.top = '';
                    window.scrollTo(0, scrollY);
                    collapseAll();
                }

                closeBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); removeOverlay(); });
                overlay.addEventListener('click', (e) => { if (e.target === overlay) removeOverlay(); });
                document.addEventListener('keydown', function onEsc(e) {
                    if (e.key === 'Escape') { removeOverlay(); document.removeEventListener('keydown', onEsc); }
                });
            }

            cards().forEach(card => {
                card.addEventListener('click', () => toggleCardExpand(card));
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCardExpand(card); }
                    if (e.key === 'Escape') collapseAll();
                });

                card.querySelector('.card-close')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    collapseAll();
                });

                card.querySelector('.card-more')?.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    toggleCardExpand(card);
                });
            });
            }
        });
    </script>

</body>
</html>
