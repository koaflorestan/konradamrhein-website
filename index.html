<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konrad Amrhein – Regisseur | Moderator | Sprecher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cascadia Code', monospace;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px 20px 20px;
            position: relative;
        }

        /* Hamburger-Icon oben links */
        .menu-icon {
            position: absolute;
            top: 25px;
            left: 25px;
            font-size: 1.8rem;
            cursor: pointer;
            user-select: none;
            z-index: 1000;
            line-height: 1;
        }

        /* Ausklappbares Menü Overlay */
        .overlay-menu {
            position: fixed;
            top: 0;
            left: -100%; /* Versteckt links außerhalb des Bildschirms */
            width: 260px;
            height: 100%;
            background-color: #ffffff;
            border-right: 2px solid #000000;
            transition: left 0.3s ease;
            z-index: 999;
            padding-top: 80px;
        }

        /* Wenn das Menü aktiv ist */
        .overlay-menu.open {
            left: 0;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
        }

        .menu-items a {
            padding: 16px 30px;
            color: #000000;
            text-decoration: none;
            font-size: 1.2rem;
            border-bottom: 1px solid #eee;
            transition: background 0.2s ease;
        }

        .menu-items a:hover {
            background-color: #000000;
            color: #ffffff;
        }

       .profile-img-container {
            position: relative;
            width: 320px;
            height: 180px;
            margin: 0 auto 24px auto;
            display: block;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Sorgt dafür, dass dein Gesicht links im runden Bereich sitzt */
            object-position: left center; 
            
            /* Exakte Form deiner Skizze */
            clip-path: polygon(
                45% 4%, 25% 15%, 12% 40%, 15% 70%, 30% 85%, 48% 82%, 
                58% 65%, 68% 55%, 82% 52%, 93% 54%, 97% 65%, 98% 78%, 
                91% 87%, 80% 88%, 68% 85%, 58% 88%, 51% 94%, 
                42% 98%, 28% 98%, 15% 94%, 8% 82%, 5% 65%, 
                4% 45%, 8% 25%, 15% 12%, 30% 6%
            );
        }

        /* Schwarzer Rahmen um die Form */
        .profile-img-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            clip-path: polygon(
                45% 4%, 25% 15%, 12% 40%, 15% 70%, 30% 85%, 48% 82%, 
                58% 65%, 68% 55%, 82% 52%, 93% 54%, 97% 65%, 98% 78%, 
                91% 87%, 80% 88%, 68% 85%, 58% 88%, 51% 94%, 
                42% 98%, 28% 98%, 15% 94%, 8% 82%, 5% 65%, 
                4% 45%, 8% 25%, 15% 12%, 30% 6%
            );
            z-index: -1;
            transform: scale(1.03);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #000000;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #000000;
            font-weight: normal;
            margin-bottom: 32px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .contact-item {
            display: inline-block;
            color: #000000;
            text-decoration: none;
            font-size: 1.05rem;
            padding: 12px 20px;
            background-color: #ffffff;
            border-radius: 0px;
            border: 1px solid #000000;
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Hamburger Icon oben links -->
    <div class="menu-icon" onclick="toggleMenu()">☰</div>

    <!-- Das ausklappbare Menü -->
    <nav class="overlay-menu" id="sideMenu">
        <div class="menu-items">
            <a href="#aktuelles" onclick="toggleMenu()">Aktuelles</a>
            <a href="#projekte" onclick="toggleMenu()">Projekte</a>
            <a href="#kontakt" onclick="toggleMenu()">Kontakt</a>
        </div>
    </nav>

    <!-- Visitenkarte -->
    <div class="card" id="kontakt">
        <!-- Dein Profilfoto -->
        <div class="profile-img-container">
    <img src="profilbild.jpg" alt="Konrad Amrhein" class="profile-img">
</div>

        <h1>Konrad Amrhein</h1>
        <p class="subtitle">Regisseur / Moderator / Sprecher</p>
        
        <div class="contact-info">
            <a href="mailto:kontakt@konradamrhein.de" class="contact-item">
                kontakt@konradamrhein.de
            </a>
            <a href="tel:+491726319068" class="contact-item">
                Tel.: +49 172 6319068
            </a>
        </div>
    </div>

    <!-- JavaScript für das Öffnen/Schließen des Menüs -->
    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            menu.classList.toggle('open');
        }
    </script>

</body>
</html>
