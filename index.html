<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konrad Amrhein – Regisseur | Moderator | Sprecher</title>
    <meta name="description" content="Konrad Amrhein – Regisseur, Moderator und Sprecher. Portfolio, Projekte und Kontakt." />
    <link rel="stylesheet" href="style.css">
</head>
<body class="home">
    <div class="slideshow-wrapper" aria-hidden="true">
        <div class="slideshow-slide slide-a"></div>
        <div class="slideshow-slide slide-b"></div>
    </div>

    <!-- Hamburger Icon oben links -->
    <div class="menu-icon" onclick="toggleMenu()" aria-controls="sideMenu" aria-expanded="false" role="button" tabindex="0">☰</div>

    <!-- Das ausklappbare Menü -->
    <nav class="overlay-menu" id="sideMenu" aria-label="Hauptnavigation">
        <div class="menu-items">
            <a href="index.html" onclick="toggleMenu()">Start</a>
            <a href="about.html" onclick="toggleMenu()">Über mich</a>
            <a href="projects.html" onclick="toggleMenu()">Projekte</a>
            <a href="contact.html" onclick="toggleMenu()">Kontakt</a>
        </div>
    </nav>

    <!-- Visitenkarte / Hauptinhalt -->
    <main id="main" class="card">
        <h1>Konrad Amrhein</h1>
    </main>

    <!-- JavaScript für das Öffnen/Schließen des Menüs -->
    <script>
        const menuBtn = document.querySelector('.menu-icon');
        const sideMenu = document.getElementById('sideMenu');
        function toggleMenu() {
            const open = sideMenu.classList.toggle('open');
            menuBtn.setAttribute('aria-expanded', open);
            if (open) sideMenu.querySelector('a').focus();
            else menuBtn.focus();
        }

        // Tastaturzugänglichkeit: Enter/Space für das Icon
        menuBtn.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleMenu();
            }
        });

        // Startseiten-Slideshow ohne Profilbild
        const homeImages = [
            'images/regentrude.jpg',
            'images/feldfuge.jpg',
            'images/kommentartheater.jpg',
            'images/laundrywrack.jpg',
            'images/viani-forte.jpg'
        ];
        let currentSlide = 0;
        const bodyEl = document.body;
        const slideA = document.querySelector('.slide-a');
        const slideB = document.querySelector('.slide-b');
        const visibleDuration = 5000;
        const fadeDuration = 1000;
        let activeSlide = slideA;
        let inactiveSlide = slideB;

        function setSlideBackground(slide, index) {
            slide.style.backgroundImage = `url('${homeImages[index]}')`;
        }

        function nextSlide() {
            const nextIndex = (currentSlide + 1) % homeImages.length;
            setSlideBackground(inactiveSlide, nextIndex);
            inactiveSlide.classList.add('active');

            setTimeout(() => {
                activeSlide.classList.remove('active');
                [activeSlide, inactiveSlide] = [inactiveSlide, activeSlide];
                currentSlide = nextIndex;
            }, fadeDuration);
        }

        if (bodyEl.classList.contains('home')) {
            setSlideBackground(slideA, currentSlide);
            setSlideBackground(slideB, (currentSlide + 1) % homeImages.length);
            slideA.classList.add('active');
            setTimeout(nextSlide, visibleDuration);
            setInterval(nextSlide, visibleDuration + fadeDuration);
        }
    </script>

</body>
</html>
