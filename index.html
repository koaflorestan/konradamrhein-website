<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konrad Amrhein – Regisseur | Moderator | Sprecher</title>
    <meta name="description" content="Konrad Amrhein – Regisseur, Moderator und Sprecher. Portfolio, Projekte und Kontakt." />
    <link rel="stylesheet" href="style.css">
</head>
<body class="home">
    <div class="slideshow-wrapper" aria-hidden="true">
        <div class="slideshow-slide slide-a"></div>
        <div class="slideshow-slide slide-b"></div>
    </div>

    <!-- Hamburger Icon oben links -->
    <button class="menu-icon" type="button" onclick="toggleMenu()" aria-controls="sideMenu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Das ausklappbare Menü -->
    <nav class="overlay-menu" id="sideMenu" aria-label="Hauptnavigation">
        <button class="menu-close" type="button" onclick="toggleMenu()" aria-label="Menü schließen">✕</button>
        <div class="menu-items">
            <a href="index.html" onclick="toggleMenu()">Start</a>
            <a href="about.html" onclick="toggleMenu()">Über mich</a>
            <a href="projects.html" onclick="toggleMenu()">Projekte</a>
            <a href="contact.html" onclick="toggleMenu()">Kontakt</a>
        </div>
    </nav>

    <!-- Visitenkarte / Hauptinhalt -->
    <main id="main" class="card">
        <h1>Konrad Amrhein</h1>
    </main>

    <!-- JavaScript für das Öffnen/Schließen des Menüs -->
    <script>
        const menuBtn = document.querySelector('.menu-icon');
        const sideMenu = document.getElementById('sideMenu');
        function toggleMenu() {
            const open = sideMenu.classList.toggle('open');
            document.body.classList.toggle('menu-open', open);
            menuBtn.classList.toggle('is-open', open);
            menuBtn.setAttribute('aria-expanded', open);
            if (open) sideMenu.querySelector('a').focus();
            else menuBtn.focus();
        }

        // Tastaturzugänglichkeit: Enter/Space für das Icon
        menuBtn.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleMenu();
            }
        });

        // Startseiten-Slideshow ohne Profilbild
        let homeImages = [];
        let currentSlide = 0;
        const bodyEl = document.body;
        const slideA = document.querySelector('.slide-a');
        const slideB = document.querySelector('.slide-b');
        const visibleDuration = 5000;
        const fadeDuration = 1000;
        let activeSlide = slideA;
        let inactiveSlide = slideB;

        function calculateBrightness(image) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const regionSize = 0.35;
            const regionWidth = Math.max(1, Math.floor(image.naturalWidth * regionSize));
            const regionHeight = Math.max(1, Math.floor(image.naturalHeight * regionSize));
            const sourceX = Math.max(0, image.naturalWidth - regionWidth);
            const sourceY = 0;
            const destWidth = Math.min(300, regionWidth);
            const destHeight = Math.min(300, regionHeight);

            canvas.width = destWidth;
            canvas.height = destHeight;
            ctx.drawImage(image, sourceX, sourceY, regionWidth, regionHeight, 0, 0, destWidth, destHeight);

            const data = ctx.getImageData(0, 0, destWidth, destHeight).data;
            let total = 0;
            let count = 0;
            const step = 40;

            for (let i = 0; i < data.length; i += step) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                total += 0.299 * r + 0.587 * g + 0.114 * b;
                count += 1;
            }

            return count > 0 ? total / count : 0;
        }

        function preloadAndMeasureImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve({ src, brightness: calculateBrightness(img) });
                img.onerror = () => resolve({ src, brightness: 0 });
                img.src = src;
            });
        }

        function setSlideBackground(slide, index) {
            slide.style.backgroundImage = `url('${homeImages[index]}')`;
        }

        function setHeadingColor(index) {
            const heading = document.querySelector('body.home h1');
            const threshold = 170;
            const isBright = brightnessValues[index] > threshold;
            // Toggle heading class and menu-icon classes together so they animate in parallel
            heading.classList.toggle('dark', isBright);
            // set CSS variable for synchronized UI color on the body (stronger scope)
            const uiColor = isBright ? '#000000' : '#ffffff';
            bodyEl.style.setProperty('--ui-color', uiColor);
        }

        function scheduleNext() {
            setTimeout(() => {
                nextSlide();
            }, visibleDuration);
        }

        function nextSlide() {
            const nextIndex = (currentSlide + 1) % homeImages.length;
            setSlideBackground(inactiveSlide, nextIndex);
            requestAnimationFrame(() => {
                inactiveSlide.classList.add('active');
            });

            // Change heading + hamburger color in the middle of the fade
            const colorChangeDelay = Math.max(0, Math.floor(fadeDuration / 2));
            setTimeout(() => {
                setHeadingColor(nextIndex);
            }, colorChangeDelay);

            setTimeout(() => {
                activeSlide.classList.remove('active');
                [activeSlide, inactiveSlide] = [inactiveSlide, activeSlide];
                currentSlide = nextIndex;
                scheduleNext();
            }, fadeDuration);
        }

        const brightnessValues = [];

        if (bodyEl.classList.contains('home')) {
            fetch('images/slideshow/manifest.json')
                .then((response) => response.json())
                .then((manifest) => {
                    homeImages = manifest.images || [];
                    return Promise.all(homeImages.map(preloadAndMeasureImage));
                })
                .then((measures) => {
                    measures.forEach((item, index) => {
                        homeImages[index] = item.src;
                        brightnessValues[index] = item.brightness;
                    });

                    if (!homeImages.length) return;
                    setSlideBackground(slideA, currentSlide);
                    setSlideBackground(slideB, (currentSlide + 1) % homeImages.length);
                    slideA.classList.add('active');
                    setHeadingColor(currentSlide);
                    scheduleNext();
                })
                .catch(() => {
                    homeImages = [
                        'images/slideshow/slide-1.jpg',
                        'images/slideshow/slide-2.jpg',
                        'images/slideshow/slide-3.jpg',
                        'images/slideshow/slide-4.jpg',
                        'images/slideshow/slide-5.jpg'
                    ];
                    return Promise.all(homeImages.map(preloadAndMeasureImage)).then((measures) => {
                        measures.forEach((item, index) => {
                            homeImages[index] = item.src;
                            brightnessValues[index] = item.brightness;
                        });
                        setSlideBackground(slideA, currentSlide);
                        setSlideBackground(slideB, (currentSlide + 1) % homeImages.length);
                        slideA.classList.add('active');
                        setHeadingColor(currentSlide);
                        scheduleNext();
                    });
                });
        }
    </script>

</body>
</html>
